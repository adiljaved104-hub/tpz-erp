name: Candidate inventory report MySQL regression isolation (non-deploying)

# Isolated QA only. Source is candidate 1944afa; temporary workflow file alone.
# No VPS access, real ERP databases, application writes, or production secrets.
on:
  push:
    branches:
      - codex/qa-candidate-reports-mysql-20261105

permissions:
  contents: read

jobs:
  report-isolation:
    name: Isolated inventory financial report PHPUnit (MySQL 8.4)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_ci_only
          MYSQL_DATABASE: tpz_qa
          MYSQL_USER: tpz_qa
          MYSQL_PASSWORD: qa_disposable_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_ci_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: tpz_qa
      DB_USERNAME: tpz_qa
      DB_PASSWORD: qa_disposable_only
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      FILESYSTEM_DISK: local
      ERP_BACKUP_SCHEDULE_ENABLED: 'false'
      ERP_DEMO_DATA_ENABLED: 'false'
      HIKVISION_ENABLED: 'false'
      MARKETPLACE_BROWSER_WORKER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact candidate code
        run: |
          test "$(git merge-base 1944afac8832716869f409f5b32cecd97063d7de HEAD)" = "1944afac8832716869f409f5b32cecd97063d7de"
          test "$(git diff --name-only 1944afac8832716869f409f5b32cecd97063d7de HEAD)" = ".github/workflows/candidate-reports-mysql-qa.yml"
          echo CANDIDATE_SOURCE=1944afac8832716869f409f5b32cecd97063d7de
      - name: Configure PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, fileinfo, gd, intl, bcmath, zip, pdo_mysql, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2
      - name: Install locked Composer dependencies without scripts
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Bootstrap disposable application
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan package:discover --ansi
      - name: Configure Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked npm dependencies
        run: npm ci
      - name: Build Vite assets
        run: npm run build
      - name: Isolate inventory financial report regression
        run: php artisan test --no-ansi tests/Feature/Reports/ReportsExportTest.php --filter=test_inventory_financial_projection_is_added_only_when_authorized
