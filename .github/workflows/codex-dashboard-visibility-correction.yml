name: Codex dashboard visibility correction QA

on:
  push:
    branches:
      - codex/web-sales-dashboard-visibility-access-20261110
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_ci_only
          MYSQL_DATABASE: tpz_dashboard_visibility_qa
          MYSQL_USER: tpz_ci
          MYSQL_PASSWORD: disposable_qa_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_ci_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: testing
      APP_DEBUG: false
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: tpz_dashboard_visibility_qa
      DB_USERNAME: tpz_ci
      DB_PASSWORD: disposable_qa_only
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      FILESYSTEM_DISK: local
      ERP_BACKUP_SCHEDULE_ENABLED: false
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, intl, pdo_mysql, bcmath
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - run: cp .env.example .env
      - run: php artisan key:generate --force
      - run: php artisan package:discover --ansi
      - run: php artisan config:clear --ansi
      - run: php artisan migrate --force --no-interaction --ansi
      - run: vendor/bin/phpunit tests/Feature/Orders/WebSalesDashboardPermissionTest.php tests/Feature/Orders/WebSalesWorkflowTest.php --testdox
      - run: vendor/bin/pint --test app/Filament/Pages/Administration/AccessControl.php app/Services/Orders/WebSalesReadService.php resources/views/filament/pages/administration/access-control.blade.php tests/Feature/Orders/WebSalesDashboardPermissionTest.php tests/Feature/Orders/WebSalesWorkflowTest.php
