name: TPZ ERP Consolidated Main Integration QA

on:
  push:
    branches:
      - integration/business-operations-main-20261105
      - codex/consolidated-qa-corrections-20261106
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql-integration:
    name: MySQL critical transactional smoke (PHP 8.3 / MySQL 8.4)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_ci_only
          MYSQL_DATABASE: tpz_ui_qa
          MYSQL_USER: tpz_ui_qa
          MYSQL_PASSWORD: qa_disposable_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_ci_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: tpz_ui_qa
      DB_USERNAME: tpz_ui_qa
      DB_PASSWORD: qa_disposable_only
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      FILESYSTEM_DISK: local
      ERP_BACKUP_SCHEDULE_ENABLED: 'false'
      ERP_DEMO_DATA_ENABLED: 'false'
      HIKVISION_ENABLED: 'false'
      MARKETPLACE_BROWSER_WORKER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, fileinfo, gd, intl, bcmath, zip, pdo_mysql, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - run: cp .env.example .env && php artisan key:generate --force && php artisan package:discover --ansi
      - name: Verify disposable MySQL configuration
        run: |
          php artisan config:clear --ansi
          test "$(php artisan tinker --execute="echo config('database.default');")" = "mysql"
          test "$(php artisan tinker --execute="echo config('database.connections.mysql.database');")" = "tpz_ui_qa"
      - name: Migration rehearsal
        run: php artisan migrate --force --no-interaction --ansi
      - name: PHP syntax and formatter checks
        run: |
          php -l app/Filament/Pages/Inventory/StockAdjustmentGridPage.php
          php -l app/Filament/Resources/StockRequests/Pages/CreateStockRequestGrid.php
          php -l app/Services/Inventory/StockRequestColumnRegistry.php
          vendor/bin/pint --test app/Filament/Pages/Inventory/StockAdjustmentGridPage.php app/Filament/Resources/StockRequests/Pages/CreateStockRequestGrid.php app/Services/Inventory/StockRequestColumnRegistry.php
      - name: Install Node.js for Vite assets
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Build Vite assets for feature tests
        run: npm run build
      - name: Blade compilation
        run: php artisan view:cache --ansi
      - name: MySQL critical transactional PHPUnit cohort (bounded)
        run: |
          cp phpunit.xml phpunit.mysql.ci.xml
          sed -i 's/<env name="DB_CONNECTION" value="sqlite"\/>/<env name="DB_CONNECTION" value="mysql"\/>/' phpunit.mysql.ci.xml
          sed -i 's/<env name="DB_DATABASE" value=":memory:"\/>/<env name="DB_DATABASE" value="tpz_ui_qa"\/>/' phpunit.mysql.ci.xml
          # This is a targeted MySQL smoke cohort, not the repository's full suite.
          # Full SQLite regression remains mandatory in the parallel job.
          # Do not use positional PHPUnit paths: PHPUnit may silently discover all tests.
          MYSQL_TESTS=(
            tests/Feature/Inventory/DefaultResponsibilityAllocationTest.php
            tests/Feature/Inventory/InventoryAllocationLedgerTest.php
            tests/Feature/Inventory/InventoryAdjustmentTest.php
            tests/Feature/Inventory/StockRequestApprovalTest.php
            tests/Feature/Inventory/StockRequestExecutionTest.php
            tests/Feature/Inventory/StockRequestFoundationTest.php
            tests/Feature/Inventory/StockRequestGridTest.php
            tests/Feature/Orders/OrderAmendmentTest.php
            tests/Feature/Orders/OrderStockSourceAccessTest.php
            tests/Feature/Orders/WebSalesWorkflowV2Test.php
            tests/Feature/Finance/PakistanOfficeFinanceWorkflowTest.php
            tests/Feature/Responsibilities/ResponsibilityAllocationEnforcementTest.php
          )
          for file in "${MYSQL_TESTS[@]}"; do
            test -f "$file" || { echo "::error::Missing MySQL cohort test: $file"; exit 1; }
            if rg -q "PRAGMA|sqlite_master|sqlite::|DB_CONNECTION.*sqlite|SQLiteConnection|new PDO\\('sqlite" "$file"; then
              echo "::error::MySQL cohort test directly references SQLite internals: $file"
              exit 1
            fi
          done
          printf '%s\\n' "${MYSQL_TESTS[@]}" > /tmp/tpz-mysql-cohort-files.txt
          echo "Explicit critical MySQL cohort: ${#MYSQL_TESTS[@]} test files; NOT full MySQL regression"
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          config = "phpunit.mysql.ci.xml"
          tree = ET.parse(config)
          root = tree.getroot()
          suites = root.find("testsuites")
          for suite in list(suites):
              suites.remove(suite)
          selected = ET.SubElement(suites, "testsuite", {"name": "MySQL-Explicit-Cohort"})
          with open("/tmp/tpz-mysql-cohort-files.txt", encoding="utf-8") as source:
              files = [line.strip() for line in source if line.strip()]
          if not files:
              raise SystemExit("No MySQL cohort tests selected")
          for file in files:
              ET.SubElement(selected, "file").text = file
          tree.write(config, encoding="unicode", xml_declaration=True)
          print(f"Explicit MySQL PHPUnit XML suite contains {len(files)} files")
          PY
          timeout --signal=TERM 35m vendor/bin/phpunit -c phpunit.mysql.ci.xml --testsuite MySQL-Explicit-Cohort --testdox 2>&1 | tee /tmp/tpz-mysql-phpunit.log
          test ${PIPESTATUS[0]} -eq 0
          rm -f phpunit.mysql.ci.xml
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-mysql-qa-logs
          path: |
            /tmp/tpz-mysql-phpunit.log
            /tmp/tpz-mysql-cohort-files.txt
            storage/logs/*.log
          if-no-files-found: ignore

  sqlite-regression:
    name: Complete SQLite regression suite (PHP 8.3)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      FILESYSTEM_DISK: local
      ERP_BACKUP_SCHEDULE_ENABLED: 'false'
      ERP_DEMO_DATA_ENABLED: 'false'
      HIKVISION_ENABLED: 'false'
      MARKETPLACE_BROWSER_WORKER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, fileinfo, gd, intl, bcmath, zip, pdo_mysql, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - run: cp .env.example .env && php artisan key:generate --force && php artisan package:discover --ansi
      - name: Verify disposable SQLite configuration
        run: |
          php artisan config:clear --ansi
          test "$(php artisan tinker --execute="echo config('database.default');")" = "sqlite"
          test "$(php artisan tinker --execute="echo config('database.connections.sqlite.database');")" = ":memory:"
      - name: SQLite migration rehearsal
        run: php artisan migrate --force --no-interaction --ansi
      - name: Install Node.js for SQLite UI tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build frontend assets for SQLite UI tests
        run: |
          npm ci
          npm run build
          test -f public/build/manifest.json
      - name: Complete SQLite PHPUnit suite (bounded)
        run: |
          timeout --signal=TERM 35m vendor/bin/phpunit --testdox tests 2>&1 | tee /tmp/tpz-sqlite-phpunit.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Upload SQLite diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-sqlite-qa-logs
          path: |
            /tmp/tpz-sqlite-phpunit.log
            storage/logs/*.log
          if-no-files-found: ignore

