name: TPZ Enterprise Login and OTP UI Staging QA (non-deploying)
on:
  push:
    branches:
      - feature/staging-enterprise-login-otp-redesign-20261126
      - fix/staging-enterprise-auth-pixel-match-20261126
      - fix/staging-auth-final-visual-polish-20261126
  pull_request:
    branches:
      - staging
permissions:
  contents: read
jobs:
  auth-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_ci_only
          MYSQL_DATABASE: tpz_qa
          MYSQL_USER: tpz_qa
          MYSQL_PASSWORD: qa_disposable_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_ci_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: tpz_qa
      DB_USERNAME: tpz_qa
      DB_PASSWORD: qa_disposable_only
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      ERP_BACKUP_SCHEDULE_ENABLED: 'false'
      ERP_DEMO_DATA_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, fileinfo, gd, intl, bcmath, zip, pdo_mysql, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2
      - name: Install locked composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Initialize disposable MySQL environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan package:discover --ansi
          php artisan migrate --force --no-ansi
      - name: Lint, Pint and compile all Blade views
        run: |
          php -l app/Filament/Auth/Login.php
          php -l app/Http/Controllers/Auth/EmailOtpAuthenticationController.php
          php -l tests/Feature/Auth/EnterpriseAuthenticationUiTest.php
          vendor/bin/pint --test app/Filament/Auth/Login.php app/Http/Controllers/Auth/EmailOtpAuthenticationController.php tests/Feature/Auth/EnterpriseAuthenticationUiTest.php
          php artisan view:cache --no-ansi
      - name: Isolated auth UI regression smoke tests
        run: php artisan test --no-ansi tests/Feature/Auth/EnterpriseAuthenticationUiTest.php
