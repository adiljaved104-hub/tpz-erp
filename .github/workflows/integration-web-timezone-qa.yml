name: Web timezone Main integration focused QA

on:
  push:
    branches:
      - integration/web-timezone-main-20261109

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_ci_only
          MYSQL_DATABASE: tpz_web_timezone_ci
          MYSQL_USER: tpz_web_timezone
          MYSQL_PASSWORD: qa_disposable_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_ci_only"
          --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: tpz_web_timezone_ci
      DB_USERNAME: tpz_web_timezone
      DB_PASSWORD: qa_disposable_only
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      FILESYSTEM_DISK: local
      ERP_BACKUP_SCHEDULE_ENABLED: 'false'
      ERP_DEMO_DATA_ENABLED: 'false'
      HIKVISION_ENABLED: 'false'
      MARKETPLACE_BROWSER_WORKER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, fileinfo, gd, intl, bcmath, zip, pdo_mysql, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Bootstrap disposable MySQL app
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan package:discover --ansi
          php artisan config:clear --ansi
          test "$(php artisan tinker --execute="echo config('database.default');")" = "mysql"
          test "$(php artisan tinker --execute="echo config('database.connections.mysql.database');")" = "tpz_web_timezone_ci"
          php artisan migrate --force --no-interaction --ansi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build frontend and compile Blade
        run: |
          npm ci
          npm run build
          php artisan view:cache --ansi
      - name: PHP syntax
        run: |
          git diff --name-only origin/main...HEAD -- '*.php' | xargs -r -n1 php -l
      - name: Focused MySQL regression suites
        run: |
          cp phpunit.xml phpunit.mysql.ci.xml
          sed -i 's/<env name="DB_CONNECTION" value="sqlite"\/>/<env name="DB_CONNECTION" value="mysql"\/>/' phpunit.mysql.ci.xml
          sed -i 's/<env name="DB_DATABASE" value=":memory:"\/>/<env name="DB_DATABASE" value="tpz_web_timezone_ci"\/>/' phpunit.mysql.ci.xml
          timeout --signal=TERM 30m vendor/bin/phpunit -c phpunit.mysql.ci.xml --testdox \
            tests/Feature/Orders/WebSalesWorkflowTest.php \
            tests/Feature/Orders/WebSalesWorkflowV2Test.php \
            tests/Feature/Orders/ManualSourcingShipmentIntegrationTest.php \
            tests/Feature/Purchases/PurchaseReceivingTest.php \
            tests/Feature/Purchases/PurchaseReceiptCorrectionTest.php \
            --filter 'test_staff_can_retrieve_received_cost_history_without_owner_only|test_last_five_history_is_ordered_by_receipt_date_then_receipt_id|test_click_action_loads_history_without_a_page_reload_and_enforces_authorization' \
            tests/Feature/Purchases/PurchaseCostHistoryPopoverTest.php \
            tests/Feature/Inventory/InventoryAllocationLedgerTest.php \
            tests/Feature/Inventory/InventoryAdjustmentTest.php \
            tests/Feature/Inventory/StockRequestGridTest.php \
            tests/Feature/Invoices/TaxInvoiceFoundationTest.php \
            tests/Feature/Invoices/TaxInvoiceOrderImportTest.php \
            tests/Feature/Invoices/TaxInvoiceUiCorrectionTest.php \
            tests/Unit/Services/UserTimezoneResolverTest.php \
            tests/Feature/Administration/TimezonePreferencesTest.php
          rm -f phpunit.mysql.ci.xml
      - name: Pint changed PHP files
        run: |
          files=$(git diff --name-only origin/main...HEAD -- '*.php')
          test -n "$files"
          vendor/bin/pint --test $files
