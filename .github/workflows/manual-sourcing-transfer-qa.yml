name: Manual sourcing and advanced transfers Linux QA

on:
  workflow_dispatch:
  push:
    branches: [qa/manual-sourcing-advanced-transfers]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-24.04
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      SESSION_DRIVER: array
      LOG_CHANNEL: stderr
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify checkout SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, dom, fileinfo, gd, intl, mbstring, pdo_sqlite, sqlite3, xml, xmlwriter, zip
          tools: composer:v2
          coverage: none
      - name: Install locked Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts
      - name: Install locked Node dependencies and build
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Prepare isolated Laravel runtime
        run: |
          mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
          touch storage/logs/laravel.log
          cp .env.example .env
          php artisan key:generate --force
          php artisan config:clear
          php artisan package:discover --ansi
      - name: Focused and regression PHPUnit suites
        run: |
          php artisan test \
            tests/Feature/Orders/ManualSourcingMigrationTest.php \
            tests/Feature/Orders/WebSalesWorkflowTest.php \
            tests/Feature/Orders/WebSalesWorkflowV2Test.php \
            tests/Feature/StockTransfers/StockTransferAdvancedWorkflowTest.php \
            tests/Feature/StockTransfers/StockTransferFilamentTest.php \
            tests/Feature/StockTransfers/StockTransferWorkflowTest.php \
            tests/Feature/StockTransfers/StockTransferAuthorizationTest.php \
            tests/Feature/Inventory/InventoryAllocationLedgerTest.php \
            tests/Feature/Responsibilities/WarehouseSalesRulesTest.php \
            tests/Feature/Invoices/QuotationSourcingTest.php \
            --compact
      - name: Pint
        if: always()
        run: vendor/bin/pint --test app/Services/Orders/ManualSourcingService.php app/Services/Orders/WebSalesService.php app/Services/Inventory/InventoryService.php app/Services/StockTransfers app/Filament/Resources/StockTransfers tests/Feature/Orders/ManualSourcingMigrationTest.php tests/Feature/StockTransfers/StockTransferAdvancedWorkflowTest.php
      - name: Blade compilation
        if: always()
        run: php artisan view:cache
      - name: Upload Laravel logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: manual-sourcing-transfer-qa-logs
          path: storage/logs/
          if-no-files-found: ignore
