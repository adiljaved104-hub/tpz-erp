name: Native Sales Workspace pagination QA (non-deploying)

on:
  push:
    branches:
      - integration/native-ui-sales-pagination-staging-20261114

permissions:
  contents: read

jobs:
  navigation:
    name: Navy shell, Sales filters, Inventory KPIs and permissions
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_ci_only
          MYSQL_DATABASE: tpz_qa
          MYSQL_USER: tpz_qa
          MYSQL_PASSWORD: qa_disposable_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_ci_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: tpz_qa
      DB_USERNAME: tpz_qa
      DB_PASSWORD: qa_disposable_only
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      FILESYSTEM_DISK: local
      ERP_BACKUP_SCHEDULE_ENABLED: 'false'
      ERP_DEMO_DATA_ENABLED: 'false'
      HIKVISION_ENABLED: 'false'
      MARKETPLACE_BROWSER_WORKER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, fileinfo, gd, intl, bcmath, zip, pdo_mysql, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2
      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Prepare disposable ERP test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan package:discover --ansi
      - name: Syntax and formatting
        run: |
          php -l app/Providers/Filament/AdminPanelProvider.php
          php -l app/Filament/Pages/SalesWorkspace.php
          php -l app/Filament/Pages/InventoryWorkspace.php
          php -l app/Filament/Pages/CustomizeNavigation.php
          php -l app/Services/Navigation/NavigationPreferenceService.php
          php -l app/Services/Preferences/UserUiPreferenceService.php
          php -l tests/Feature/Navigation/WorkspaceNavigationOptInTest.php
          php -l tests/Feature/Navigation/NativeWorkspacesTest.php
          vendor/bin/pint --test app/Filament/Pages/SalesWorkspace.php app/Filament/Pages/InventoryWorkspace.php tests/Feature/Navigation/NativeWorkspacesTest.php
      - name: Rehearse schema on disposable MySQL
        run: php artisan migrate --force --no-ansi
      - name: Compile Blade and Filament components
        run: php artisan view:cache --no-ansi
      - name: Validate Vite navy theme asset build
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Navigation opt-in and existing navigation regression tests
        run: php artisan test --no-ansi tests/Feature/Navigation/NativeWorkspacesTest.php tests/Feature/Navigation/WorkspaceNavigationOptInTest.php
