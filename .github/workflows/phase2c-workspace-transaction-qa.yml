name: Phase 2C Workspace Transaction QA

on:
  pull_request:
    paths:
      - 'app/Filament/Pages/SalesWorkspace.php'
      - 'app/Filament/Pages/InventoryWorkspace.php'
      - 'app/Filament/Pages/PurchasingWorkspace.php'
      - 'app/Filament/Pages/Purchasing/QuickStockPurchase.php'
      - 'resources/views/filament/pages/operational-workspace.blade.php'
      - 'resources/views/filament/pages/quick-purchase-workspace-compatible.blade.php'
      - 'resources/views/filament/pages/partials/workspace-products.blade.php'
      - 'resources/views/filament/pages/partials/workspace-quick-purchase.blade.php'
      - 'resources/views/filament/pages/inventory/stock-adjustments.blade.php'
      - 'tests/Feature/Purchases/QuickStockPurchaseUiTest.php'
      - 'resources/views/filament/pages/sales-workspace.blade.php'
      - 'resources/views/filament/pages/inventory-workspace.blade.php'
      - 'tests/Feature/Navigation/NativeWorkspacesTest.php'
      - 'tests/Feature/Orders/WebSalesWorkflowTest.php'
      - '.github/workflows/phase2c-workspace-transaction-qa.yml'
  workflow_dispatch:

jobs:
  focused-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: tpz_workspace_phase2c_test
          MYSQL_USER: tpz_test
          MYSQL_PASSWORD: tpz_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, mysql, pdo_mysql, bcmath
          coverage: none
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Temporary application key
        run: echo "APP_KEY=base64:$(php -r 'echo base64_encode(random_bytes(32));')" >> "$GITHUB_ENV"
      - name: PHP syntax checks (changed actions)
        run: |
          php -l app/Filament/Pages/SalesWorkspace.php
          php -l app/Filament/Pages/PurchasingWorkspace.php
          php -l app/Filament/Pages/Purchasing/QuickStockPurchase.php
          php -l app/Filament/Pages/InventoryWorkspace.php
          php -l tests/Feature/Navigation/NativeWorkspacesTest.php
          php -l tests/Feature/Purchases/QuickStockPurchaseUiTest.php
      - name: Focused workspace formatting
        run: vendor/bin/pint --test app/Filament/Pages/SalesWorkspace.php app/Filament/Pages/PurchasingWorkspace.php app/Filament/Pages/Purchasing/QuickStockPurchase.php tests/Feature/Navigation/NativeWorkspacesTest.php tests/Feature/Purchases/QuickStockPurchaseUiTest.php
      - name: Migrate disposable MySQL database
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: tpz_workspace_phase2c_test
          DB_USERNAME: tpz_test
          DB_PASSWORD: tpz_test
        run: php artisan migrate --force
      - name: Blade compilation
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: tpz_workspace_phase2c_test
          DB_USERNAME: tpz_test
          DB_PASSWORD: tpz_test
        run: php artisan view:cache
      - name: Focused isolated MySQL Livewire regression
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: tpz_workspace_phase2c_test
          DB_USERNAME: tpz_test
          DB_PASSWORD: tpz_test
        run: |
          vendor/bin/phpunit tests/Feature/Navigation/NativeWorkspacesTest.php tests/Feature/Purchases/QuickStockPurchaseUiTest.php tests/Feature/Invoices/TaxInvoiceFoundationTest.php tests/Feature/Orders/WebSalesWorkflowTest.php
          vendor/bin/phpunit --filter 'save_all|grid_filters|unauthorized_staff|adjustment_override|grid_keeps_edits|read_only_shared' tests/Feature/Inventory/InventoryAdjustmentTest.php
