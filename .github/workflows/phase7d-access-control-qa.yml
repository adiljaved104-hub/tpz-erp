name: Phase 7D Access Control QA

on:
  pull_request:
    paths:
      - 'app/Filament/Pages/Administration/AccessControl.php'
      - 'resources/views/filament/pages/administration/access-control.blade.php'
      - 'tests/Feature/AccessControl/**'
      - '.github/workflows/phase7d-access-control-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  access-control-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: tpz_access_control_qa
          MYSQL_USER: tpz_test
          MYSQL_PASSWORD: tpz_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: tpz_access_control_qa
      DB_USERNAME: tpz_test
      DB_PASSWORD: tpz_test
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, mysql, pdo_mysql, bcmath
          coverage: none
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Temporary application key
        run: echo "APP_KEY=base64:$(php -r 'echo base64_encode(random_bytes(32));')" >> "$GITHUB_ENV"
      - name: Syntax and formatting
        run: |
          php -l app/Filament/Pages/Administration/AccessControl.php
          php -l tests/Feature/AccessControl/AccessControlMatrixTest.php
          vendor/bin/pint --test app/Filament/Pages/Administration/AccessControl.php tests/Feature/AccessControl/AccessControlMatrixTest.php
      - name: Migrate disposable MySQL
        run: php artisan migrate --force
      - name: Compile Blade
        run: php artisan view:cache
      - name: Focused Access Control regression
        run: vendor/bin/phpunit tests/Feature/AccessControl/AccessControlMatrixTest.php tests/Feature/AccessControl/OwnerRoleProtectionTest.php
