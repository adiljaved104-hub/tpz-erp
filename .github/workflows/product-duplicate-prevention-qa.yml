name: Product duplicate prevention QA

on:
  push:
    branches:
      - codex/product-duplicate-prevention-20261111
      - integration/product-duplicate-prevention-main-20261111
  workflow_dispatch:

permissions:
  contents: read

jobs:
  duplicate-prevention:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_ci_only
          MYSQL_DATABASE: tpz_product_duplicate_qa
          MYSQL_USER: tpz_ci
          MYSQL_PASSWORD: disposable_qa_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_ci_only"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: tpz_product_duplicate_qa
      DB_USERNAME: tpz_ci
      DB_PASSWORD: disposable_qa_only
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      FILESYSTEM_DISK: local
      ERP_BACKUP_SCHEDULE_ENABLED: 'false'
      ERP_DEMO_DATA_ENABLED: 'false'
      HIKVISION_ENABLED: 'false'
      MARKETPLACE_BROWSER_WORKER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, fileinfo, gd, intl, bcmath, zip, pdo_mysql, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Bootstrap disposable MySQL
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan package:discover --ansi
          php artisan config:clear --ansi
          test "$(php artisan tinker --execute="echo config('database.default');")" = "mysql"
          php artisan migrate --force --no-interaction --ansi
      - name: Focused duplicate regression tests
        run: |
          timeout --signal=TERM 20m vendor/bin/phpunit tests/Feature/ProductIntelligence/ProductDuplicatePreventionTest.php tests/Feature/ProductIntelligence/ProductTitlesAndImportTest.php
      - name: Syntax and Pint
        run: |
          php -l app/Actions/Products/CreateProduct.php
          php -l app/Actions/Products/UpdateProduct.php
          php -l app/Services/ProductIntelligence/ProductDuplicateGuard.php
          php -l app/Services/Quotations/QuotationManualProductMaterializer.php
          php -l tests/Feature/ProductIntelligence/ProductDuplicatePreventionTest.php
          vendor/bin/pint --test app/Actions/Products/CreateProduct.php app/Actions/Products/UpdateProduct.php app/Services/ProductIntelligence/ProductDuplicateGuard.php app/Services/Quotations/QuotationManualProductMaterializer.php tests/Feature/ProductIntelligence/ProductDuplicatePreventionTest.php
