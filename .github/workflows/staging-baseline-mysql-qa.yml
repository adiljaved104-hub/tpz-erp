name: Staging baseline MySQL regression comparison (non-deploying)

# One-time isolated QA. This branch starts at Staging baseline c714fdff.
# Never accesses VPS, real ERP databases, production secrets, or deployment tools.
on:
  push:
    branches:
      - codex/qa-staging-baseline-mysql-20261105

permissions:
  contents: read

jobs:
  phpunit:
    name: PHP 8.3 PHPUnit (MySQL 8.4 suite — baseline)
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_ci_only
          MYSQL_DATABASE: tpz_qa
          MYSQL_USER: tpz_qa
          MYSQL_PASSWORD: qa_disposable_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_ci_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    timeout-minutes: 30
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: tpz_qa
      DB_USERNAME: tpz_qa
      DB_PASSWORD: qa_disposable_only
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      FILESYSTEM_DISK: local
      ERP_BACKUP_SCHEDULE_ENABLED: 'false'
      ERP_DEMO_DATA_ENABLED: 'false'
      HIKVISION_ENABLED: 'false'
      MARKETPLACE_BROWSER_WORKER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact baseline code
        run: |
          test "$(git rev-parse HEAD^)" = "c714fdff6bb77b7c4721338c8e8b9db9d381a9c9"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/staging-baseline-mysql-qa.yml"
          echo BASELINE_SOURCE=c714fdff6bb77b7c4721338c8e8b9db9d381a9c9
      - name: Configure PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, fileinfo, gd, intl, bcmath, zip, pdo_mysql, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2
      - name: Install locked Composer dependencies without setup scripts
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Bootstrap disposable test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan package:discover --ansi
      - name: Configure Node.js 22 for browser assets
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked browser dependencies
        run: npm ci
      - name: Build Vite assets before UI tests
        run: npm run build
      - name: Run complete PHPUnit suite
        run: php artisan test --no-ansi
