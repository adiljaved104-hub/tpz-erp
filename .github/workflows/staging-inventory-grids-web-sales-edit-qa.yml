name: Staging Inventory Grids and Web Sales Edit QA (non-deploying)
on:
  push:
    branches:
      - codex/staging-inventory-grids-web-sales-edit-20261105

permissions:
  contents: read

jobs:
  focused:
    name: PHP 8.3 MySQL 8.4 UI and Web Sales amendment regression
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_ci_only
          MYSQL_DATABASE: tpz_qa
          MYSQL_USER: tpz_qa
          MYSQL_PASSWORD: qa_disposable_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_ci_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: tpz_qa
      DB_USERNAME: tpz_qa
      DB_PASSWORD: qa_disposable_only
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      FILESYSTEM_DISK: local
      ERP_BACKUP_SCHEDULE_ENABLED: 'false'
      ERP_DEMO_DATA_ENABLED: 'false'
      HIKVISION_ENABLED: 'false'
      MARKETPLACE_BROWSER_WORKER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify staging ancestry and exact 10-file scope
        run: |
          git merge-base --is-ancestor 6e8acf6076ef4d45a54fad0f663268b3ace24d4f HEAD
          git diff --name-only 6e8acf6076ef4d45a54fad0f663268b3ace24d4f HEAD > /tmp/paths
          cat /tmp/paths
          test "$(wc -l < /tmp/paths)" -eq 10
          grep -qx 'app/Services/Orders/WebSalesService.php' /tmp/paths
          grep -qx 'app/Filament/Resources/WebSalesOrders/Pages/ViewWebSalesOrder.php' /tmp/paths
          grep -qx 'app/Filament/Pages/Inventory/StockAdjustmentGridPage.php' /tmp/paths
          grep -qx 'resources/views/filament/pages/inventory/stock-adjustments.blade.php' /tmp/paths
          grep -qx 'app/Filament/Resources/StockRequests/Pages/CreateStockRequestGrid.php' /tmp/paths
          grep -qx 'resources/views/filament/resources/stock-requests/pages/create-stock-request-grid.blade.php' /tmp/paths
          grep -qx 'tests/Feature/Orders/WebSalesWorkflowV2Test.php' /tmp/paths
          grep -qx 'tests/Feature/Inventory/InventoryAdjustmentTest.php' /tmp/paths
          grep -qx 'tests/Feature/Inventory/StockRequestGridTest.php' /tmp/paths
          grep -qx '.github/workflows/staging-inventory-grids-web-sales-edit-qa.yml' /tmp/paths
          test -z "$(git diff --name-only 6e8acf6076ef4d45a54fad0f663268b3ace24d4f HEAD -- database/migrations composer.json composer.lock)"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, fileinfo, gd, intl, bcmath, zip, pdo_mysql, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Bootstrap isolated environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan package:discover --ansi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: PHP syntax checks
        run: |
          php -l app/Services/Orders/WebSalesService.php
          php -l app/Filament/Resources/WebSalesOrders/Pages/ViewWebSalesOrder.php
          php -l app/Filament/Pages/Inventory/StockAdjustmentGridPage.php
          php -l resources/views/filament/pages/inventory/stock-adjustments.blade.php
          php -l app/Filament/Resources/StockRequests/Pages/CreateStockRequestGrid.php
          php -l resources/views/filament/resources/stock-requests/pages/create-stock-request-grid.blade.php
          php -l tests/Feature/Orders/WebSalesWorkflowV2Test.php
          php -l tests/Feature/Inventory/InventoryAdjustmentTest.php
          php -l tests/Feature/Inventory/StockRequestGridTest.php
      - name: Disposable database migration rehearsal
        run: php artisan migrate --force --no-ansi
      - name: Compile Blade and layouts
        run: php artisan view:cache --no-ansi
      - name: Web Sales Edit and Order Amendment
        run: php artisan test --no-ansi tests/Feature/Orders/WebSalesWorkflowV2Test.php
      - name: Stock Requests Grid
        run: php artisan test --no-ansi tests/Feature/Inventory/StockRequestGridTest.php
      - name: Stock Adjustment Grid UI and posting
        run: |
          php artisan test --no-ansi tests/Feature/Inventory/InventoryAdjustmentTest.php \
            --filter='test_adjustment_grid_filters_column_visibility|test_save_all_posts_one_atomic_batch|test_grid_loads_scoped_rows_and_true_stock|test_grid_keeps_edits_as_drafts_and_rejects_an_invalid_batch'
