name: Web Sales optional supplier UAT QA (non-deploying)
on:
  push:
    branches:
      - codex/staging-web-sales-optional-supplier-20261105

permissions:
  contents: read

jobs:
  web-sales-optional-supplier:
    name: PHP 8.3 MySQL 8.4 Web Sales supplier optional regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_ci_only
          MYSQL_DATABASE: tpz_qa
          MYSQL_USER: tpz_qa
          MYSQL_PASSWORD: qa_disposable_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_ci_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: tpz_qa
      DB_USERNAME: tpz_qa
      DB_PASSWORD: qa_disposable_only
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      FILESYSTEM_DISK: local
      ERP_BACKUP_SCHEDULE_ENABLED: 'false'
      ERP_DEMO_DATA_ENABLED: 'false'
      HIKVISION_ENABLED: 'false'
      MARKETPLACE_BROWSER_WORKER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm exact parent and changed paths
        run: |
          git merge-base --is-ancestor 483b19750a95a6ced62406c5fadbd6a091608861 HEAD
          git diff --name-only 483b19750a95a6ced62406c5fadbd6a091608861 HEAD > /tmp/modified-paths
          cat /tmp/modified-paths
          test "$(wc -l < /tmp/modified-paths)" -eq 5
          grep -qx 'app/Filament/Resources/WebSalesOrders/Schemas/WebSalesOrderForm.php' /tmp/modified-paths
          grep -qx 'app/Services/Orders/ManualSourcingService.php' /tmp/modified-paths
          grep -qx 'app/Filament/Resources/WebSalesOrders/Pages/ViewWebSalesOrder.php' /tmp/modified-paths
          grep -qx 'tests/Feature/Orders/WebSalesWorkflowV2Test.php' /tmp/modified-paths
          grep -qx '.github/workflows/staging-web-sales-optional-supplier-qa.yml' /tmp/modified-paths
          test -z "$(git diff --name-only 483b19750a95a6ced62406c5fadbd6a091608861 HEAD -- database/migrations composer.json composer.lock)"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, fileinfo, gd, intl, bcmath, zip, pdo_mysql, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Prepare isolated test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan package:discover --ansi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check PHP syntax
        run: |
          php -l app/Filament/Resources/WebSalesOrders/Schemas/WebSalesOrderForm.php
          php -l app/Services/Orders/ManualSourcingService.php
          php -l app/Filament/Resources/WebSalesOrders/Pages/ViewWebSalesOrder.php
          php -l tests/Feature/Orders/WebSalesWorkflowV2Test.php
      - name: Rehearse schema in disposable database
        run: php artisan migrate --force --no-ansi
      - name: Web Sales targeted Livewire and service integration
        run: php artisan test --no-ansi tests/Feature/Orders/WebSalesWorkflowV2Test.php
      - name: Stock Transfers guarded regression check
        run: php artisan test --no-ansi tests/Feature/StockTransfers/StockTransferUatRuntimeHotfixTest.php
