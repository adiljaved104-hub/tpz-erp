name: Stock Requests partial approval focused QA (non-deploying)

on:
  push:
    branches:
      - integration/stock-requests-ux-staging-20261113

permissions:
  contents: read

jobs:
  stock-requests:
    name: PHP 8.3 + MySQL 8.4 targeted migration and stock request checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_ci_only
          MYSQL_DATABASE: tpz_qa
          MYSQL_USER: tpz_qa
          MYSQL_PASSWORD: qa_disposable_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_ci_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: tpz_qa
      DB_USERNAME: tpz_qa
      DB_PASSWORD: qa_disposable_only
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      FILESYSTEM_DISK: local
      ERP_BACKUP_SCHEDULE_ENABLED: 'false'
      ERP_DEMO_DATA_ENABLED: 'false'
      HIKVISION_ENABLED: 'false'
      MARKETPLACE_BROWSER_WORKER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, fileinfo, gd, intl, bcmath, zip, pdo_mysql, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2
      - name: Install project dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Prepare disposable ERP environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan package:discover --ansi
      - name: Syntax and changed-file formatting
        run: |
          php -l app/Services/Inventory/StockRequestApprovalService.php
          php -l app/Services/Inventory/StockRequestExecutionService.php
          php -l app/Filament/Resources/StockRequests/Pages/ViewStockRequest.php
          php -l app/Filament/Resources/StockRequests/Pages/CreateStockRequestGrid.php
          php -l database/migrations/2026_11_13_180000_add_partial_stock_request_tracking.php
          vendor/bin/pint --test app/Services/Inventory/StockRequestApprovalService.php app/Services/Inventory/StockRequestExecutionService.php app/Filament/Resources/StockRequests/Pages/ViewStockRequest.php app/Filament/Resources/StockRequests/Pages/CreateStockRequestGrid.php tests/Feature/Inventory/StockRequestExecutionTest.php
      - name: Rehearse migration on disposable MySQL 8.4
        run: php artisan migrate --force --no-ansi
      - name: Compile Blade pages
        run: php artisan view:cache --no-ansi
      - name: Focused Stock Requests inventory execution and grid tests
        run: php artisan test --no-ansi tests/Feature/Inventory/StockRequestExecutionTest.php tests/Feature/Inventory/StockRequestGridTest.php
