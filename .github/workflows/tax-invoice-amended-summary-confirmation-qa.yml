name: Tax Invoice Amended Summary and Save Confirmation QA

on:
  push:
    branches:
      - fix/staging-invoice-amended-summary-confirmation-20261125
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invoice-price:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_ci_only
          MYSQL_DATABASE: tpz_qa
          MYSQL_USER: tpz_qa
          MYSQL_PASSWORD: qa_disposable_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_ci_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: tpz_qa
      DB_USERNAME: tpz_qa
      DB_PASSWORD: qa_disposable_only
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      FILESYSTEM_DISK: local
      ERP_BACKUP_SCHEDULE_ENABLED: 'false'
      ERP_DEMO_DATA_ENABLED: 'false'
      HIKVISION_ENABLED: 'false'
      MARKETPLACE_BROWSER_WORKER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, fileinfo, gd, intl, bcmath, zip, pdo_mysql, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Setup disposable environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan package:discover --ansi
      - name: PHP syntax
        run: |
          php -l app/Services/Invoices/TaxInvoicePriceCorrectionService.php
          php -l app/Models/TaxInvoicePriceAdjustmentProposal.php
          php -l app/Services/Invoices/TaxInvoiceAdjustmentIssuanceService.php
          php -l app/Models/TaxInvoiceAdjustmentDocument.php
          php -l app/Models/TaxInvoiceAdjustmentReviewDecision.php
          php -l app/Http/Controllers/TaxInvoiceAmendedSummaryPdfController.php
          php -l app/Filament/Resources/TaxInvoices/Pages/CreateTaxInvoice.php
          php -l app/Http/Controllers/TaxInvoiceAdjustmentDocumentPdfController.php
          php -l routes/web.php
          php -l app/Filament/Resources/TaxInvoices/Pages/ViewTaxInvoice.php
          php -l tests/Feature/Invoices/TaxInvoicePriceCorrectionTest.php
          php -l tests/Feature/Invoices/TaxInvoiceAdjustmentIssuanceTest.php
          php -l database/migrations/2026_11_24_170000_create_tax_invoice_price_adjustment_proposals.php
          php -l database/migrations/2026_11_25_090000_create_tax_invoice_adjustment_review_decisions.php
          php -l database/migrations/2026_11_25_091000_create_tax_invoice_adjustment_documents.php
      - name: Formatting
        run: |
          vendor/bin/pint --test app/Filament/Resources/TaxInvoices/Pages/CreateTaxInvoice.php app/Http/Controllers/TaxInvoiceAmendedSummaryPdfController.php app/Enums/InvoicePermission.php app/Services/Authorization/InvoiceAuthorization.php app/Services/Authorization/EmployeePermissionCatalog.php app/Services/Authorization/AccessControlModuleRegistry.php app/Services/Invoices/TaxInvoicePriceCorrectionService.php app/Services/Invoices/TaxInvoiceAdjustmentIssuanceService.php app/Models/TaxInvoicePriceAdjustmentProposal.php app/Models/TaxInvoiceAdjustmentReviewDecision.php app/Models/TaxInvoiceAdjustmentDocument.php app/Http/Controllers/TaxInvoiceAdjustmentDocumentPdfController.php app/Filament/Resources/TaxInvoices/Pages/ViewTaxInvoice.php tests/Feature/Invoices/TaxInvoicePriceCorrectionTest.php tests/Feature/Invoices/TaxInvoiceAdjustmentIssuanceTest.php database/migrations/2026_11_24_170000_create_tax_invoice_price_adjustment_proposals.php database/migrations/2026_11_25_090000_create_tax_invoice_adjustment_review_decisions.php database/migrations/2026_11_25_091000_create_tax_invoice_adjustment_documents.php config/tax_invoice_adjustments.php
      - name: Migrate isolated MySQL
        run: php artisan migrate --force --no-ansi
      - name: Blade compile
        run: php artisan view:cache --no-ansi
      - name: Focused tests
        run: |
          php artisan test --no-ansi tests/Feature/Invoices/TaxInvoicePriceCorrectionTest.php tests/Feature/Invoices/TaxInvoiceAdjustmentIssuanceTest.php
          php artisan test --no-ansi tests/Feature/Invoices/TaxInvoiceUiCorrectionTest.php --filter='test_invoice_create_form|test_save_invoice_creates_once|test_save_download_and_new|test_save_then_download_action'
