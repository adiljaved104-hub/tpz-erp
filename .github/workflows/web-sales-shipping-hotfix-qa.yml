name: Web Sales Shipping Hotfix QA

on:
  workflow_dispatch:
  push:
    branches:
      - codex/web-sales-shipping-reference-20261113

jobs:
  focused-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: tpz_erp_hotfix_test
          MYSQL_USER: tpz_test
          MYSQL_PASSWORD: tpz_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, mysql, pdo_mysql, bcmath
          coverage: none

      - name: Verify disposable MySQL identity
        env:
          MYSQL_PWD: root
        run: mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root -e "SELECT DATABASE(), @@version, @@hostname;"

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Migrate disposable MySQL database
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: tpz_erp_hotfix_test
          DB_USERNAME: tpz_test
          DB_PASSWORD: tpz_test
        run: php artisan migrate --force

      - name: PHP syntax checks
        shell: bash
        run: |
          find app tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Pint changed files
        run: vendor/bin/pint --test app/Services/ReferenceSequenceService.php app/Services/Orders/OrderService.php app/Services/Orders/WebSalesService.php app/Services/Orders/ManualSourcingShipmentService.php app/Filament/Resources/WebSalesOrders/Pages/ViewWebSalesOrder.php tests/Feature/Orders/ManualSourcingShipmentIntegrationTest.php

      - name: Focused Web Sales and manual sourcing tests
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: tpz_erp_hotfix_test
          DB_USERNAME: tpz_test
          DB_PASSWORD: tpz_test
        run: >-
          vendor/bin/phpunit
          tests/Feature/Orders/WebSalesWorkflowTest.php
          tests/Feature/Orders/WebSalesWorkflowV2Test.php
          tests/Feature/Orders/ManualSourcingShipmentIntegrationTest.php
          tests/Feature/Orders/ManualSourcingShipmentProvenanceTest.php
