<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TPZ Accounting — Owner Review Prototype</title>
<style>
:root{--navy:#122b43;--blue:#176b87;--teal:#13a68b;--gold:#e2a93b;--paper:#f4f7fa;--line:#dbe3ea;--ink:#182b3c;--muted:#637789;--white:#fff;--red:#b84c4c;--shadow:0 8px 24px #102f4612}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 Inter,"Segoe UI",Arial,sans-serif}.shell{min-height:100vh;display:grid;grid-template-columns:232px minmax(0,1fr)}aside{background:var(--navy);color:white;padding:20px 12px;display:flex;flex-direction:column;gap:16px}.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 15px;border-bottom:1px solid #ffffff25}.mark{width:34px;height:34px;border-radius:10px;background:var(--teal);display:grid;place-items:center;font-weight:800}.brand strong{display:block;font-size:15px}.brand small{color:#b6c8d6}.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#8fa7ba;padding:5px 10px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#d4e0e9;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer;font:inherit}.nav button:hover,.nav button.active{background:#ffffff18;color:#fff}.nav button.active{box-shadow:inset 3px 0 var(--teal)}.aside-foot{margin-top:auto;color:#a8bdcc;font-size:11px;padding:10px}.main{min-width:0}.top{height:64px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 24px;position:sticky;top:0;z-index:3}.company{font-weight:650;white-space:nowrap}.search{margin-left:auto;width:min(390px,45vw);position:relative}.search input{width:100%;padding:10px 13px 10px 36px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#f9fbfc}.search:before{content:'⌕';position:absolute;left:13px;top:5px;font-size:23px;color:#8093a3}.key{font-size:11px;color:#76899a;background:#fff;border:1px solid var(--line);padding:2px 5px;border-radius:4px;position:absolute;right:8px;top:9px}.avatar{border-radius:50%;width:32px;height:32px;display:grid;place-items:center;background:#dff3ef;color:#087e6a;font-weight:700}.content{padding:24px;max-width:1500px;margin:auto}.tabs{height:42px;display:flex;align-items:end;gap:4px;border-bottom:1px solid var(--line);margin:-7px 0 20px;overflow:auto}.tab{border:0;background:transparent;padding:10px 13px;color:var(--muted);white-space:nowrap;cursor:pointer;font:inherit;border-bottom:2px solid transparent}.tab.active{color:var(--blue);border-color:var(--teal);font-weight:650}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:18px}.head h1{margin:0 0 3px;font-size:24px;letter-spacing:-.02em}.sub{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer;font:inherit;font-weight:600}.btn:hover{border-color:#94b0c1}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.accent{background:var(--teal);border-color:var(--teal);color:#fff}.btn.small{padding:5px 9px;font-size:12px}.btn:disabled{opacity:.45;cursor:not-allowed}.banner{background:#fff8e8;border:1px solid #f1d99d;color:#72531a;border-radius:9px;padding:9px 12px;margin:0 0 16px;font-size:12px}.grid{display:grid;gap:14px}.cards{grid-template-columns:repeat(4,minmax(0,1fr))}.card,.panel{background:white;border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow)}.card{padding:16px}.card label{color:var(--muted);font-size:12px}.metric{font-size:23px;font-weight:700;margin:6px 0 2px}.delta{font-size:11px;color:#16826f}.panel{padding:16px}.panel h2{font-size:15px;margin:0 0 12px}.split{grid-template-columns:1.35fr 1fr}.activity{display:grid;gap:0}.activity div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #edf1f4}.activity div:last-child{border:0}.pill{border-radius:99px;background:#e5f4f1;color:#177965;padding:3px 8px;font-size:11px;white-space:nowrap}.pill.gray{background:#eef2f5;color:#607487}.pill.amber{background:#fff2d5;color:#8d681b}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select,.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:7px;padding:8px 10px;font:inherit;background:#fff;color:var(--ink)}.toolbar input{min-width:180px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:9px}table{width:100%;border-collapse:collapse;min-width:680px}th{text-align:left;color:#637789;background:#f7f9fb;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:10px;border-bottom:1px solid #edf1f4;vertical-align:middle}tr:last-child td{border:0}tbody tr:hover{background:#f8fbfc}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}.link{color:var(--blue);font-weight:600;cursor:pointer}.formgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:12px 0}.field{display:grid;gap:5px}.field label{font-size:11px;color:var(--muted);font-weight:600}.field input,.field select{width:100%}.formtotal{margin-left:auto;width:min(300px,100%);padding:14px 0 0}.formtotal div{display:flex;justify-content:space-between;padding:4px 0}.formtotal .grand{border-top:1px solid var(--line);margin-top:5px;padding-top:9px;font-weight:750;font-size:17px}.notice{background:#eff7fb;padding:12px;border-radius:8px;color:#36596e;margin:12px 0}.report-list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.report{padding:13px;border:1px solid var(--line);border-radius:9px;cursor:pointer}.report:hover{border-color:var(--teal);background:#f7fcfb}.report strong{display:block}.report small{color:var(--muted)}.shortcuts{display:flex;gap:8px;flex-wrap:wrap}.shortcut{border:1px solid var(--line);background:#f8fafb;border-radius:6px;padding:7px 9px;font-size:12px}.kbd{font:11px ui-monospace,monospace;border:1px solid #cbd6de;background:#fff;border-radius:4px;padding:2px 5px;color:#506272}.toast{position:fixed;right:22px;bottom:22px;padding:12px 16px;background:var(--navy);color:white;border-radius:9px;box-shadow:var(--shadow);display:none;z-index:9}.empty{padding:32px;text-align:center;color:var(--muted)}.hidden{display:none!important}
@media(max-width:950px){.shell{grid-template-columns:68px minmax(0,1fr)}aside{padding:16px 8px}.brand{justify-content:center;padding:4px 0 14px}.brand div:last-child,.nav-label,.nav button span:not(.ico),.aside-foot{display:none}.nav button{text-align:center;padding:11px 4px}.ico{font-size:18px}.cards{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.formgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.top{padding:0 12px}.company{font-size:12px}.search{width:auto;flex:1}.content{padding:16px 12px}.head{display:grid}.head h1{font-size:21px}.cards{grid-template-columns:1fr 1fr;gap:8px}.card{padding:12px}.metric{font-size:18px}.report-list{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr 1fr}.tabs{margin-top:0}.avatar{display:none}}
</style></head>
<body><div class="shell"><aside><div class="brand"><div class="mark">TP</div><div><strong>TPZ ERP</strong><small>Accounting workspace</small></div></div><div><div class="nav-label">Accounting</div><nav class="nav" id="nav"></nav></div><div class="aside-foot">Design review prototype<br>All amounts are synthetic</div></aside><main class="main"><header class="top"><div class="company">Tech Point Zone · UAE Books ▾</div><div class="search"><input id="globalSearch" placeholder="Search accounts, customers, transactions…" aria-label="Global search"><span class="key">Ctrl K</span></div><div class="avatar">OP</div></header><div class="content"><div class="tabs" id="tabs"></div><div id="view"></div></div></main></div><div id="toast" class="toast"></div>
<script>
const pages=[['home','⌂','Accounting Home'],['coa','▦','Chart of Accounts'],['customers','♙','Customer Center'],['vendors','♧','Vendor Center'],['invoice','＋','Sales Invoice'],['bill','▤','Supplier Bill'],['journal','≋','General Journal'],['banking','⇄','Banking Center'],['reports','▥','Financial Reports']];
const nav=document.querySelector('#nav'),tabs=document.querySelector('#tabs'),view=document.querySelector('#view');let current='home',openTabs=['home'],rowCount=3;
const accounts=[['1000','Cash and Cash Equivalents','Bank','Debit',48250],['1100','Accounts Receivable','Accounts Receivable','Debit',18640],['1200','Inventory Asset','Other Current Asset','Debit',92110],['2000','Accounts Payable','Accounts Payable','Credit',-27450],['3000','Owner Equity','Equity','Credit',-80000],['4000','Product Sales','Income','Credit',-118400],['5000','Cost of Goods Sold','Cost of Goods Sold','Debit',62300],['6100','Bank Charges','Expense','Debit',1250]];
const customers=[['C-1042','Gulf Horizon Trading','Dubai','AED 8,450','Current'],['C-1048','Al Noor Electronics','Sharjah','AED 6,900','1–30 days'],['C-1051','Vertex Office Systems','Abu Dhabi','AED 3,290','Current'],['C-1056','Marina Tech Supplies','Ajman','AED 0','Paid']];
const vendors=[['V-2081','Desert Circuit Components','Dubai','AED 12,800','Due in 7 days'],['V-2088','Northstar Distribution','Sharjah','AED 9,450','Due today'],['V-2093','Emirates Packaging LLC','Ajman','AED 5,200','Current'],['V-2099','Cityline Logistics','Dubai','AED 0','Paid']];
function money(n){return new Intl.NumberFormat('en-AE',{style:'currency',currency:'AED'}).format(n)}
function notify(s){let t=document.querySelector('#toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
function go(id){current=id;if(!openTabs.includes(id))openTabs.push(id);render()}
function renderNav(){nav.innerHTML=pages.map(([id,icon,label])=>`<button class="${current===id?'active':''}" onclick="go('${id}')"><span class="ico">${icon}</span> <span>${label}</span></button>`).join('')}
function renderTabs(){tabs.innerHTML=openTabs.map(id=>`<button class="tab ${current===id?'active':''}" onclick="go('${id}')">${pages.find(p=>p[0]===id)[2]} <span onclick="event.stopPropagation();closeTab('${id}')">×</span></button>`).join('')}
function closeTab(id){if(id==='home')return;openTabs=openTabs.filter(x=>x!==id);if(current===id)current='home';render()}
const head=(title,sub,actions='')=>`<div class="head"><div><h1>${title}</h1><div class="sub">${sub}</div></div><div class="actions">${actions}</div></div>`;
const btn=(text,fn,cls='')=>`<button class="btn ${cls}" onclick="${fn}">${text}</button>`;
const posting=`<div class="banner">Review prototype · Synthetic data only · Accounting posting is disabled. Save, Post, and payment actions do not write to ERP or QuickBooks.</div>`;
function home(){return `${head('Good morning, Owner','UAE Books · AED · As of 12 Nov 2026',btn('Customize dashboard',"notify('Dashboard layout controls are a prototype')"))}${posting}<div class="grid cards"><div class="card"><label>Cash and bank</label><div class="metric">AED 48,250</div><div class="delta">2 accounts · 1 needs review</div></div><div class="card"><label>Open receivables</label><div class="metric">AED 18,640</div><div class="delta">3 customer balances</div></div><div class="card"><label>Open payables</label><div class="metric">AED 27,450</div><div class="delta">2 bills due this week</div></div><div class="card"><label>Net income · YTD</label><div class="metric">AED 54,850</div><div class="delta">Synthetic preview balance</div></div></div><div class="grid split" style="margin-top:14px"><section class="panel"><h2>Work queue</h2><div class="activity"><div><span>Match 4 bank transactions</span><button class="btn small" onclick="go('banking')">Review</button></div><div><span>2 supplier bills due soon</span><button class="btn small" onclick="go('vendors')">Open bills</button></div><div><span>1 customer invoice overdue</span><button class="btn small" onclick="go('customers')">Follow up</button></div><div><span>October close checklist</span><span class="pill amber">In progress</span></div></div></section><section class="panel"><h2>Quick create <span class="sub">· keyboard friendly</span></h2><div class="grid" style="grid-template-columns:1fr 1fr">${btn('＋ Sales invoice',"go('invoice')",'primary')}${btn('＋ Supplier bill',"go('bill')")}${btn('＋ Journal entry',"go('journal')")}${btn('⇄ Reconcile account',"go('banking')")}</div><h2 style="margin-top:20px">Recent activity</h2><div class="activity"><div><span>INV-26041 · Gulf Horizon</span><span>AED 4,250</span></div><div><span>BILL-1049 · Desert Circuit</span><span>AED 6,800</span></div><div><span>JE-0018 · Month-end accrual</span><span class="pill gray">Draft</span></div></div></section></div>`}
function coa(){return `${head('Chart of Accounts','8 sample accounts · drill into account activity',btn('＋ New account',"notify('New account form is a prototype')",'primary'))}${posting}<div class="panel"><div class="toolbar"><input placeholder="Filter by name or number" oninput="filterRows(this,'coaTable')"><select><option>All account types</option><option>Bank</option><option>Income</option><option>Expense</option></select><select><option>Active accounts</option><option>All accounts</option></select>${btn('⚙ Columns',"notify('Column chooser prototype')")}</div><div class="tablewrap"><table id="coaTable"><thead><tr><th>Number</th><th>Account name</th><th>Type</th><th>Normal balance</th><th class="num">Balance</th><th></th></tr></thead><tbody>${accounts.map(a=>`<tr><td>${a[0]}</td><td><span class="link" onclick="drill('${a[1]}')">${a[1]}</span></td><td>${a[2]}</td><td>${a[3]}</td><td class="num">${money(a[4])}</td><td><button class="btn small" onclick="drill('${a[1]}')">Register ↗</button></td></tr>`).join('')}</tbody></table></div></div>`}
function centers(which){let isC=which==='customers',list=isC?customers:vendors,title=isC?'Customer Center':'Vendor Center';return `${head(title,isC?'Customer balances, invoices, payments and credits':'Supplier balances, bills, payments and credits',btn(isC?'＋ New customer':'＋ New vendor',"notify('Contact form is a prototype')",'primary'))}${posting}<div class="grid cards" style="margin-bottom:14px"><div class="card"><label>${isC?'Open AR':'Open AP'}</label><div class="metric">${isC?'AED 18,640':'AED 27,450'}</div><div class="sub">Across 3 open balances</div></div><div class="card"><label>Past due</label><div class="metric">${isC?'AED 3,290':'AED 9,450'}</div><div class="sub">Needs follow-up</div></div><div class="card"><label>Transactions this month</label><div class="metric">${isC?'24':'18'}</div><div class="sub">Invoices, credits and payments</div></div><div class="card"><label>Shortcuts</label><div class="actions">${btn(isC?'New invoice':'New bill',`go('${isC?'invoice':'bill'}')`,'small')}</div></div></div><div class="panel"><div class="toolbar"><input placeholder="Search ${isC?'customers':'vendors'}" oninput="filterRows(this,'peopleTable')"><select><option>All statuses</option><option>Open balance</option><option>Inactive</option></select><select><option>All dates</option><option>This month</option></select></div><div class="tablewrap"><table id="peopleTable"><thead><tr><th>${isC?'Customer':'Vendor'} ID</th><th>Name</th><th>Location</th><th class="num">Open balance</th><th>Status / due</th><th></th></tr></thead><tbody>${list.map(r=>`<tr><td>${r[0]}</td><td><span class="link" onclick="detail('${r[1]}')">${r[1]}</span></td><td>${r[2]}</td><td class="num">${r[3]}</td><td><span class="pill ${r[4]==='Paid'?'gray':''}">${r[4]}</span></td><td><button class="btn small" onclick="detail('${r[1]}')">History ↗</button></td></tr>`).join('')}</tbody></table></div></div>`}
function transaction(kind){let invoice=kind==='invoice',journal=kind==='journal',title=invoice?'Sales Invoice':journal?'General Journal':'Supplier Bill',doc=invoice?'INV-26042':journal?'JE-0019':'BILL-1050';let rows=journal?[['1000','Cash and Cash Equivalents','Month-end test line','250.00',''],['6100','Bank Charges','Month-end test line','','250.00']]:[['SKU-441','Laptop — synthetic item','1','4,250.00','4,250.00'],['SKU-219','USB-C Dock — synthetic item','2','350.00','700.00']];return `${head(title,`${journal?'Manual adjustment draft · balanced preview':'Document draft'} · ${doc}`,btn('Save draft',"notify('Draft remains in local prototype only')")+btn('Print preview',"window.print()")+btn('Post / Send',"notify('Posting is disabled in this prototype')",'primary'))}${posting}<div class="panel"><div class="formgrid"><div class="field"><label>${invoice?'Customer':journal?'Journal no.':'Vendor'}</label><input value="${invoice?'Gulf Horizon Trading':journal?doc:'Desert Circuit Components'}"></div><div class="field"><label>${journal?'Journal date':'Date'}</label><input type="date" value="2026-11-12"></div><div class="field"><label>${journal?'Period':'Terms'}</label><select><option>${journal?'Nov 2026 · Open':'Net 30'}</option></select></div><div class="field"><label>Reference</label><input placeholder="PO / external reference"></div></div><div class="toolbar">${btn('＋ Add line',"addLine()",'small')}${btn('Duplicate line',"notify('Use Ctrl+D to duplicate selected row')",'small')}<span class="sub">Tip: Tab moves across cells · Enter adds a row</span></div><div class="tablewrap"><table id="entryGrid"><thead><tr><th>${journal?'Account':'Item'}</th><th>${journal?'Description':'Description'}</th><th>${journal?'Debit':'Qty'}</th><th>${journal?'Credit':'Rate'}</th><th class="num">Amount</th></tr></thead><tbody>${rows.map(r=>`<tr><td contenteditable="true">${r[0]}</td><td contenteditable="true">${r[1]}</td><td contenteditable="true">${r[2]}</td><td contenteditable="true">${r[3]}</td><td contenteditable="true" class="num">${r[4]||r[3]}</td></tr>`).join('')}</tbody></table></div><div class="formgrid"><div class="field" style="grid-column:span 2"><label>Memo</label><input placeholder="Internal note (audited after posting)"></div><div class="field"><label>Currency</label><select><option>AED · Base currency</option></select></div><div class="field"><label>Exchange rate</label><input value="1.000000"></div></div><div class="notice">${journal?'Journal preview balances: debits AED 250.00 · credits AED 250.00. Posting still unavailable.':'Transaction lines, tax and totals are synthetic previews. No receivable/payable or inventory ledger is updated.'}</div><div class="formtotal"><div><span>Subtotal</span><span>${journal?'AED 250.00':'AED 4,950.00'}</span></div><div><span>VAT preview</span><span>AED 0.00</span></div><div class="grand"><span>Total</span><span>${journal?'Balanced':'AED 4,950.00'}</span></div></div></div>`}
function banking(){return `${head('Banking Center','Review imported statement activity and match candidates',btn('＋ Add statement file',"notify('Statement upload is disabled in prototype')")+btn('Reconcile account',"notify('Reconciliation workspace opened in preview')",'primary'))}${posting}<div class="grid cards"><div class="card"><label>Operating Bank · AED</label><div class="metric">AED 48,250</div><div class="sub">Book balance · updated Nov 12</div></div><div class="card"><label>Statement ending balance</label><div class="metric">AED 46,910</div><div class="sub">Statement date Nov 11</div></div><div class="card"><label>To review</label><div class="metric">4 items</div><div class="sub">AED 5,960 net</div></div><div class="card"><label>Last reconciliation</label><div class="metric">Oct 31</div><div class="sub">Difference AED 0.00</div></div></div><div class="panel" style="margin-top:14px"><div class="toolbar"><select><option>Operating Bank · AED</option><option>Petty Cash · AED</option></select><input type="date" value="2026-11-01"><input type="date" value="2026-11-12">${btn('Find matches',"notify('Synthetic match suggestions refreshed')")}</div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Statement description</th><th class="num">Amount</th><th>Suggested match</th><th>Confidence</th><th>Action</th></tr></thead><tbody><tr><td>Nov 11</td><td>GULF HORIZON TRADING</td><td class="num">AED 4,250.00</td><td>Receipt · INV-26041</td><td><span class="pill">Strong</span></td><td>${btn('Match',"notify('Match simulated only')",'small')}</td></tr><tr><td>Nov 10</td><td>DESERT CIRCUIT COMPONENTS</td><td class="num">AED -2,800.00</td><td>Bill payment · BILL-1047</td><td><span class="pill">Strong</span></td><td>${btn('Match',"notify('Match simulated only')",'small')}</td></tr><tr><td>Nov 9</td><td>MONTHLY BANK FEE</td><td class="num">AED -85.00</td><td>Bank Charges · 6100</td><td><span class="pill amber">Review</span></td><td>${btn('Review',"notify('Category review simulated only')",'small')}</td></tr></tbody></table></div></div>`}
function reports(){let names=['Profit and Loss','Balance Sheet','Statement of Cash Flows','Trial Balance','General Ledger','A/R Aging Summary','A/P Aging Summary','Inventory Valuation Summary','Sales by Customer','Expenses by Vendor','Bank Reconciliation Summary','Audit History'];return `${head('Financial Reports Center','Saved views, fast filters and drill-through to source transactions',btn('＋ New custom report',"notify('Custom report builder is a prototype')",'primary')+btn('Saved reports',"notify('Saved report library opened')"))}${posting}<div class="panel"><div class="toolbar"><input placeholder="Find a report"><select><option>All report groups</option><option>Company & Financial</option><option>Customers & Receivables</option><option>Vendors & Payables</option><option>Inventory</option><option>Banking</option></select><select><option>Accrual basis</option><option>Cash basis</option></select></div><div class="report-list">${names.map((n,i)=>`<div class="report" onclick="reportResult('${n}')"><strong>${n}</strong><small>${i<5?'Company & Financial':i<7?'Receivables & Payables':i===7||i===8?'Sales & Inventory':i===10?'Banking':'Management'} · Customize ↗</small></div>`).join('')}</div></div><div id="reportResult" style="margin-top:14px"></div>`}
function reportResult(n){document.querySelector('#reportResult').innerHTML=`<section class="panel"><div class="head"><div><h2>${n}</h2><div class="sub">Period: Jan 1 – Nov 12, 2026 · Accrual · AED</div></div><div class="actions"><button class="btn small" onclick="notify('Report settings saved in prototype')">Save view</button><button class="btn small" onclick="notify('Export preview only')">Export</button></div></div><div class="tablewrap"><table><thead><tr><th>Account / source</th><th class="num">Amount</th></tr></thead><tbody><tr><td><span class="link" onclick="drill('Product Sales')">Product Sales · click to drill down</span></td><td class="num">AED 118,400.00</td></tr><tr><td><span class="link" onclick="drill('Cost of Goods Sold')">Cost of Goods Sold · click to drill down</span></td><td class="num">AED 62,300.00</td></tr><tr><td>Gross Profit</td><td class="num">AED 56,100.00</td></tr><tr><td>Operating expenses</td><td class="num">AED 1,250.00</td></tr><tr><td><strong>Net Income</strong></td><td class="num"><strong>AED 54,850.00</strong></td></tr></tbody></table></div></section>`}
function detail(n){notify(`${n} · contact profile / linked transaction history preview`)}function drill(n){notify(`${n} · register opened in linked tab preview`)}function filterRows(input,id){let q=input.value.toLowerCase();document.querySelectorAll(`#${id} tbody tr`).forEach(r=>r.classList.toggle('hidden',!r.innerText.toLowerCase().includes(q)))}function addLine(){let tb=document.querySelector('#entryGrid tbody');let tr=document.createElement('tr');tr.innerHTML='<td contenteditable="true">Choose account/item</td><td contenteditable="true">Description</td><td contenteditable="true">1</td><td contenteditable="true">0.00</td><td contenteditable="true" class="num">0.00</td>';tb.appendChild(tr);tr.cells[0].focus()}
function render(){renderNav();renderTabs();view.innerHTML=({home,coa,customers:()=>centers('customers'),vendors:()=>centers('vendors'),invoice:()=>transaction('invoice'),bill:()=>transaction('bill'),journal:()=>transaction('journal'),banking,reports})[current]()}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.querySelector('#globalSearch').focus()}if(e.key==='F2'){e.preventDefault();notify('F2 · open selected record')}if(e.key==='Escape')document.querySelector('#globalSearch').blur()});document.querySelector('#globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value){go(e.target.value.toLowerCase().includes('vendor')?'vendors':e.target.value.toLowerCase().includes('invoice')?'invoice':e.target.value.toLowerCase().includes('account')?'coa':'reports');notify('Showing best synthetic result')}});render();
</script></body></html>
